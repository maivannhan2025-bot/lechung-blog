name: Build & Deploy web Lê Chung

# Mỗi khi có bài mới (kể cả bài viết qua Pages CMS đẩy lên GitHub),
# máy này tự build lại web Astro rồi đăng lên Cloudflare Pages
# (project lechung-web, trong tài khoản Cloudflare của Lê Chung).
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Tự dựng lại mỗi ngày lúc 08:00 giờ VN (01:00 UTC) để các bài đã tới ngày đăng tự hiện ra
  schedule:
    - cron: '0 1 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7f1f6ca5a97b720a663eb8338957a03a
          command: pages deploy dist --project-name=lechung-web --branch=main

      # Báo cho Bing/Yandex... biết web vừa có URL mới/đổi, để họ mò lại sớm hơn
      # (IndexNow — không phục vụ Google, Google dùng sitemap + Request Indexing riêng).
      # Không có gì bí mật trong KEY này (nó vốn phải public qua file .txt) nên để thẳng trong workflow.
      - name: Báo IndexNow (Bing/Yandex)
        run: |
          node -e "
            const fs = require('fs');
            const KEY = 'c344eb47d7931a24d5f5365fa3f72f2ad1f97f14';
            const HOST = 'lechung.vn';
            const xml = fs.readFileSync('dist/sitemap.xml', 'utf8');
            const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
            fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify({ host: HOST, key: KEY, keyLocation: 'https://' + HOST + '/' + KEY + '.txt', urlList: urls }),
            }).then(r => console.log('IndexNow trả về status:', r.status, '- số URL đã gửi:', urls.length))
              .catch(e => console.log('IndexNow lỗi (bỏ qua, không chặn deploy):', e.message));
          "
