name: Build & Deploy web Lê Chung

# Mỗi khi có bài mới (kể cả bài viết qua Pages CMS đẩy lên GitHub),
# máy này tự build lại web Astro rồi đăng lên Cloudflare Pages
# (project lechung-web, trong tài khoản Cloudflare của Lê Chung).
on:
  # Repo NAY la nguon chinh cua lechung.vn tu 05/09/2026 — Cong dang bai ghi thang vao day.
  push:
    branches: [main]
  workflow_dispatch: {}
  # Dung lai moi ngay 08:00 gio VN de bai hen ngay tu hien ra
  schedule:
    # Dựng 2 tiếng/lần (bằng timhangxetai.com) để bài hẹn GIỜ tự hiện đúng giờ,
    # thay vì phải chờ tới 08:00 sáng hôm sau.
    - cron: '0 */2 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = lấy đủ lịch sử, để web đọc được "lúc sửa gần nhất" của từng bài từ Git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      # Chup lai sitemap DANG live TRUOC khi deploy, de lat nua biet bai nao vua moi len.
      - name: Ghi nhớ sitemap đang live (để biết bài nào mới)
        run: node .github/bao-index.mjs ghi-nho

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7f1f6ca5a97b720a663eb8338957a03a
          command: pages deploy dist --project-name=lechung-web --branch=main

      # Bao cho Bing/Yandex/Naver/Seznam biet BAI VUA LEN CONG KHAI (IndexNow).
      # Chi bao URL moi hoac doi ngay — khong bao lai ca sitemap. Google KHONG dung
      # IndexNow: Google di theo sitemap + Search Console.
      - name: Báo index bài vừa lên công khai
        run: node .github/bao-index.mjs bao
