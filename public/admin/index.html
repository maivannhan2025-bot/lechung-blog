<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viết bài blog — Lê Chung</title>
<meta name="robots" content="noindex">
<style>
  :root{ --bg:#0a2540; --brand:#ff6b35; --brand-dark:#e5541f; --text:#eaf1fa; --muted:#a7b8cc; --card:#0f2942; --line:#234260; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;line-height:1.6;padding:24px}
  .box{max-width:440px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 28px;
    box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .mark{width:56px;height:56px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;
    font-size:22px;font-weight:800;margin:0 auto 16px;box-shadow:0 6px 18px rgba(255,107,53,.4)}
  h1{font-size:22px;margin:0 0 8px;font-weight:800}
  p{color:var(--muted);font-size:15px;margin:0 0 22px}
  a.go{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:800;font-size:16px;
    padding:14px 26px;border-radius:12px;box-shadow:0 8px 24px rgba(255,107,53,.35)}
  a.go:hover{background:var(--brand-dark)}
  .note{margin-top:18px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">LC</div>
    <h1>Viết bài blog Lê Chung</h1>
    <p>Trang viết bài dùng <b>Pages CMS</b>. Bấm nút dưới, đăng nhập bằng <b>GitHub</b> rồi viết bài.</p>
    <a class="go" href="https://app.pagescms.org" target="_blank" rel="noopener">Vào viết bài →</a>
    <div class="note">Chủ web: đăng nhập bằng <b>GitHub</b> (weblechungvn-oss). Người viết được mời có thể đăng nhập bằng email.</div>
  </div>
</body>
</html>
