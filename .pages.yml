            label: Câu trả lời
            type: text
      - name: secTruCot
        label: "Lý do mua — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
          - name: intro
            label: Câu giới thiệu
            type: text
      - name: truCot
        label: "Lý do mua — 3 trụ cột"
        type: object
        list:
          collapsible:
            summary: "{t}"
        fields:
          - name: t
            label: Tên trụ cột
            type: string
          - name: d
            label: Mô tả
            type: text
      - name: gioiHan
        label: "Nhắc đặt sớm (giới hạn)"
        type: object
        fields:
          - name: title
            label: Tiêu đề
            type: string
          - name: body
            label: Nội dung
            type: text
      - name: secBangGia
        label: "Bảng giá — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
      - name: secQuaTang
        label: "Quà tặng — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
      - name: secDanhGia
        label: "Cảm nhận khách — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
      - name: secBlog
        label: "Blog kinh nghiệm — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
      - name: ctaCuoi
        label: "Kêu gọi cuối trang (CTA)"
        type: object
        fields:
          - name: title
            label: Tiêu đề
            type: string
          - name: body
            label: Nội dung
            type: text

  - name: blog
    label: Bài viết Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: [ngayDang]
      default:
        sort: ngayDang
        order: desc
    fields:
      - name: title
        label: Tiêu đề bài viết
        type: string
        required: true
        description: Tiêu đề chính, cũng là dòng chữ to nhất của bài. Nên có từ khoá SEO.

      - name: description
        label: Mô tả ngắn (SEO)
        type: text
        required: true
        description: 1-2 câu tóm tắt bài, hiện trên Google. Nên 120-160 ký tự, có từ khoá.

      - name: ngayDang
        label: Ngày đăng
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd

      - name: thoiGianDoc
        label: Thời gian đọc (phút)
        type: number
        required: false
        description: Ước lượng số phút đọc hết bài. Không bắt buộc.

      - name: anhDaiDien
        label: Ảnh đại diện
        type: image
        required: false
        description: Ảnh hiện đầu bài (không bắt buộc). Tải ảnh thật từ máy lên.

      - name: body
        label: Nội dung bài viết
        type: rich-text
        options:
          format: markdown
