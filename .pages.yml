# Cấu hình Pages CMS cho blog Lê Chung — https://pagescms.org
# Chủ web đăng nhập bằng GitHub (weblechungvn-oss) qua app.pagescms.org.
# Có thể mời thêm người viết bằng email (người được mời viết bài không cần tài khoản GitHub).

# Ảnh: upload vào public/anh, trong bài ghi đường dẫn /anh/...
media:
  input: public/anh
  output: /anh
  categories: [image]

content:
  - name: chung
    label: Cài đặt chung (số điện thoại · Zalo · logo)
    type: file
    path: src/data/chung.json
    format: json
    fields:
      - name: hotline
        label: Số hotline hiển thị (nút gọi, chân trang…)
        type: string
        description: 'Số điện thoại dạng đẹp để hiện ra, ví dụ 0839 861 499.'
      - name: tel
        label: Số gọi (chỉ chữ số — dùng khi khách bấm nút Gọi)
        type: string
        description: 'Chỉ chữ số liền nhau, ví dụ 0839861499.'
      - name: zalo
        label: Số Zalo (nút Chat Zalo)
        type: string
        description: 'Chỉ chữ số liền nhau, ví dụ 0839861499. Nút Zalo sẽ mở zalo.me/(số này).'
      - name: logo
        label: Logo (góc trên bên trái mọi trang)
        type: image
        description: 'Bấm tải logo mới lên để thay. Nên dùng ảnh nền trong suốt (PNG/WebP).'

  - name: trangchu
    label: Trang chủ (ảnh / video đầu trang)
    type: file
    path: src/data/trangchu.json
    format: json
    fields:
      - name: heroVideo
        label: Link video YouTube (khung đầu trang sẽ CHIẾU VIDEO)
        type: string
        description: 'Dán link YouTube vào đây (ví dụ https://www.youtube.com/watch?v=abc123 hoặc https://youtu.be/abc123) để khung lớn đầu trang chiếu video. ĐỂ TRỐNG nếu muốn dùng ẢNH thay vì video.'
      - name: heroAnh
        label: Ảnh khung đầu trang (dùng khi ô link video ở trên ĐỂ TRỐNG)
        type: image
        description: 'Bấm để tải ảnh mới lên. Ảnh này chỉ hiện khi ô "Link video YouTube" ở trên để trống.'

  - name: blog
    label: Bài viết Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: [ngayDang]
      default:
        sort: ngayDang
        order: desc
    fields:
      - name: title
        label: Tiêu đề bài viết
        type: string
        required: true
        description: Tiêu đề chính, cũng là dòng chữ to nhất của bài. Nên có từ khoá SEO.

      - name: description
        label: Mô tả ngắn (SEO)
        type: text
        required: true
        description: 1-2 câu tóm tắt bài, hiện trên Google. Nên 120-160 ký tự, có từ khoá.

      - name: ngayDang
        label: Ngày đăng
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd

      - name: thoiGianDoc
        label: Thời gian đọc (phút)
        type: number
        required: false
        description: Ước lượng số phút đọc hết bài. Không bắt buộc.

      - name: anhDaiDien
        label: Ảnh đại diện
        type: image
        required: false
        description: Ảnh hiện đầu bài (không bắt buộc). Tải ảnh thật từ máy lên.

      - name: body
        label: Nội dung bài viết
        type: rich-text
        options:
          format: markdown
