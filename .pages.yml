# Cấu hình Pages CMS cho blog Lê Chung — https://pagescms.org
# Chủ web đăng nhập bằng GitHub (weblechungvn-oss) qua app.pagescms.org.
# Có thể mời thêm người viết bằng email (người được mời viết bài không cần tài khoản GitHub).

# Ảnh: upload vào public/anh, trong bài ghi đường dẫn /anh/...
media:
  input: public/anh
  output: /anh
  categories: [image]

content:
  - name: chung
    label: Cài đặt chung (số điện thoại · Zalo · logo)
    type: file
    path: src/data/chung.json
    format: json
    fields:
      - name: hotline
        label: Số hotline hiển thị (nút gọi, chân trang…)
        type: string
        description: 'Số điện thoại dạng đẹp để hiện ra, ví dụ 0839 861 499.'
      - name: tel
        label: Số gọi (chỉ chữ số — dùng khi khách bấm nút Gọi)
        type: string
        description: 'Chỉ chữ số liền nhau, ví dụ 0839861499.'
      - name: zalo
        label: Số Zalo (nút Chat Zalo)
        type: string
        description: 'Chỉ chữ số liền nhau, ví dụ 0839861499. Nút Zalo sẽ mở zalo.me/(số này).'
      - name: logo
        label: Logo (góc trên bên trái mọi trang)
        type: image
        description: 'Bấm tải logo mới lên để thay. Nên dùng ảnh nền trong suốt (PNG/WebP).'
      - name: fbPixel
        label: Mã Facebook Pixel (chạy quảng cáo — không bắt buộc)
        type: string
        description: 'Dán DÃY SỐ ID Pixel lấy từ Trình quản lý sự kiện Facebook (ví dụ 1234567890123456). Để TRỐNG nếu chưa dùng. Có mã này thì web tự gắn theo dõi khách để chạy quảng cáo Facebook.'

  - name: trangchu
    label: Trang chủ (ảnh / video đầu trang)
    type: file
    path: src/data/trangchu.json
    format: json
    fields:
      - name: heroVideo
        label: Link video YouTube (khung đầu trang sẽ CHIẾU VIDEO)
        type: string
        description: 'Dán link YouTube vào đây (ví dụ https://www.youtube.com/watch?v=abc123 hoặc https://youtu.be/abc123) để khung lớn đầu trang chiếu video. ĐỂ TRỐNG nếu muốn dùng ẢNH thay vì video.'
      - name: heroAnh
        label: Ảnh khung đầu trang (dùng khi ô link video ở trên ĐỂ TRỐNG)
        type: image
        description: 'Bấm để tải ảnh mới lên. Ảnh này chỉ hiện khi ô "Link video YouTube" ở trên để trống.'
      - name: heroEyebrow
        label: "Đầu trang — dòng chữ nhỏ phía trên tiêu đề"
        type: string
      - name: heroH1
        label: "Đầu trang — TIÊU ĐỀ LỚN"
        type: text
      - name: heroLead
        label: "Đầu trang — đoạn mô tả dưới tiêu đề"
        type: text
      - name: heroTicks
        label: "Đầu trang — các gạch đầu dòng (mỗi dòng 1 ý)"
        type: string
        list: true
      - name: heroBtnGia
        label: "Đầu trang — chữ trên nút phụ (mặc định: Xem bảng giá →)"
        type: string
      - name: dichVuTag
        label: "Mục Dịch vụ — nhãn nhỏ"
        type: string
      - name: dichVuTitle
        label: "Mục Dịch vụ — tiêu đề"
        type: string
      - name: dichVuIntro
        label: "Mục Dịch vụ — câu giới thiệu"
        type: text
      - name: dichVu
        label: "Mục Dịch vụ — danh sách loại xe"
        type: object
        list:
          collapsible:
            summary: "{ten}"
        fields:
          - name: img
            label: Ảnh loại xe
            type: image
            description: 'Bấm để tải ảnh mới thay ảnh loại xe này.'
          - name: ten
            label: Tên loại xe
            type: string
          - name: bullets
            label: Các dòng mô tả (mỗi dòng 1 ý)
            type: string
            list: true
      - name: bangGia
        label: "Bảng giá — danh sách dòng giá theo tuyến"
        type: object
        list:
          collapsible:
            summary: "{vung}"
        fields:
          - name: vung
            label: Tuyến / vùng
            type: string
          - name: t8
            label: Giá xe 8 tấn (triệu đồng)
            type: string
          - name: t10
            label: Giá xe 10 tấn (triệu đồng)
            type: string
          - name: t15
            label: Giá xe 15 tấn (triệu đồng)
            type: string
          - name: t20
            label: Giá xe 20 tấn (triệu đồng)
            type: string
          - name: tg
            label: Thời gian vận chuyển
            type: string
      - name: quaTang
        label: "Quà tặng / cam kết thêm (mỗi dòng 1 ý)"
        type: string
        list: true
      - name: danhGia
        label: "Cảm nhận khách hàng"
        type: object
        list:
          collapsible:
            summary: "{ten}"
        fields:
          - name: avatar
            label: Ảnh khách
            type: image
          - name: ten
            label: Tên khách
            type: string
          - name: chuc
            label: Chức vụ / công ty
            type: string
          - name: noi
            label: Lời cảm nhận
            type: text
      - name: badges
        label: "Dải cam dưới đầu trang (mỗi ô 1 dòng)"
        type: string
        list: true
      - name: secNoiDau
        label: "Nỗi lo — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
          - name: intro
            label: Câu giới thiệu
            type: text
      - name: noiDau
        label: "Nỗi lo — danh sách thẻ"
        type: object
        list:
          collapsible:
            summary: "{t}"
        fields:
          - name: t
            label: Tiêu đề thẻ
            type: string
          - name: d
            label: Mô tả
            type: text
      - name: secUyTin
        label: "Uy tín — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
          - name: intro
            label: Câu giới thiệu
            type: text
      - name: uyTin
        label: "Uy tín — danh sách thẻ"
        type: object
        list:
          collapsible:
            summary: "{t}"
        fields:
          - name: t
            label: Tiêu đề thẻ
            type: string
          - name: d
            label: Mô tả
            type: text
      - name: secTruocSau
        label: "Trước / Sau — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
          - name: truocTitle
            label: Tiêu đề cột TRƯỚC
            type: string
          - name: sauTitle
            label: Tiêu đề cột SAU
            type: string
      - name: truoc
        label: "Trước — các dòng (mỗi dòng 1 ý)"
        type: string
        list: true
      - name: sau
        label: "Sau — các dòng (mỗi dòng 1 ý)"
        type: string
        list: true
      - name: secLoiIch
        label: "Lợi ích — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
          - name: intro
            label: Câu giới thiệu
            type: text
      - name: loiIch
        label: "Lợi ích — danh sách thẻ"
        type: object
        list:
          collapsible:
            summary: "{t}"
        fields:
          - name: t
            label: Tiêu đề thẻ
            type: string
          - name: d
            label: Mô tả
            type: text
      - name: secKhuVuc
        label: "Khu vực — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
          - name: intro
            label: Câu giới thiệu
            type: text
      - name: camXuc
        label: "Câu chạm cảm xúc"
        type: object
        fields:
          - name: big
            label: Câu lớn
            type: text
          - name: small
            label: Câu nhỏ bên dưới
            type: text
      - name: secQuyTrinh
        label: "Quy trình — tiêu đề mục"
        type: object
        fields:
          - name: tag
            label: Nhãn nhỏ
            type: string
          - name: title
            label: Tiêu đề
            type: string
      - name: quyTrinh
        label: "Quy trình — các bước"
        type: object
        list:
          collapsible:
            summary: "{t}"
        fields:
          - name: s
            label: Số thứ tự (01, 02…)
            type: string
          - name: t
            label: Tên bước
            type: string
          - name: d
